<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .box{fill:#f8fbff;stroke:#2c3e50;stroke-width:2}
      .title{font:700 18px Arial, Helvetica, sans-serif;fill:#2c3e50}
      .label{font:14px Arial, Helvetica, sans-serif;fill:#2c3e50}
      .small{font:12px Arial, Helvetica, sans-serif;fill:#34495e}
      .line{stroke:#2c3e50;stroke-width:2;fill:none;marker-end:url(#arr)}
      .dashed{stroke-dasharray:6 6}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" class="title">系统架构图（路由分级预取与缓存预算调度）</text>

  <!-- Client -->
  <rect x="40" y="80" width="340" height="540" rx="10" class="box"/>
  <text x="60" y="110" class="title">客户端</text>

  <rect x="60" y="140" width="300" height="70" rx="8" class="box"/>
  <text x="75" y="170" class="label">UI/页面</text>

  <rect x="60" y="225" width="300" height="70" rx="8" class="box"/>
  <text x="75" y="255" class="label">Router 中间件</text>

  <rect x="60" y="310" width="300" height="60" rx="8" class="box"/>
  <text x="75" y="345" class="label">预取计划（等级/时序/TTL）</text>

  <rect x="60" y="380" width="300" height="70" rx="8" class="box"/>
  <text x="75" y="410" class="label">Service Worker 执行器</text>

  <rect x="60" y="465" width="140" height="60" rx="8" class="box"/>
  <text x="75" y="500" class="label">缓存存储</text>

  <rect x="220" y="465" width="140" height="60" rx="8" class="box"/>
  <text x="235" y="500" class="label">端侧轻量模型</text>

  <rect x="60" y="540" width="300" height="60" rx="8" class="box"/>
  <text x="75" y="575" class="label">埋点/画像采集（会话/网络/设备/命中/耗时）</text>

  <!-- Edge -->
  <rect x="430" y="80" width="320" height="540" rx="10" class="box"/>
  <text x="450" y="110" class="title">边缘网关</text>

  <rect x="450" y="140" width="280" height="70" rx="8" class="box"/>
  <text x="465" y="170" class="label">策略下发 / 灰度与回滚</text>

  <!-- Cloud -->
  <rect x="780" y="80" width="380" height="540" rx="10" class="box"/>
  <text x="800" y="110" class="title">云侧</text>

  <rect x="800" y="140" width="340" height="70" rx="8" class="box"/>
  <text x="815" y="170" class="label">大模型策略服务（路由概率/资源效用/解释）</text>

  <rect x="800" y="225" width="340" height="70" rx="8" class="box"/>
  <text x="815" y="255" class="label">预算约束求解 / 阈值生成</text>

  <rect x="800" y="310" width="340" height="70" rx="8" class="box"/>
  <text x="815" y="340" class="label">策略/版本/白名单 仓库</text>

  <rect x="800" y="395" width="340" height="70" rx="8" class="box"/>
  <text x="815" y="425" class="label">反事实评估 / 训练与蒸馏</text>

  <!-- Lines -->
  <path class="line" d="M 210 250 L 450 250"/>
  <text x="330" y="240" class="small" text-anchor="middle">策略请求/候选</text>

  <path class="line" d="M 730 270 L 800 270"/>
  <text x="765" y="260" class="small" text-anchor="middle">转发</text>

  <path class="line" d="M 970 295 L 970 360"/>

  <path class="line" d="M 1120 300 L 770 300"/>
  <text x="945" y="290" class="small" text-anchor="middle">返回策略与阈值</text>

  <path class="line" d="M 450 290 L 360 290"/>
  <text x="405" y="280" class="small" text-anchor="middle">下发</text>

  <path class="line" d="M 210 420 L 210 460"/>
  <text x="210" y="445" class="small" text-anchor="middle">写入缓存</text>

  <path class="line dashed" d="M 210 525 L 970 525"/>
  <text x="590" y="550" class="small" text-anchor="middle">日志与指标 → 离线评估/蒸馏</text>

  <path class="line" d="M 210 345 L 210 380"/>
  <text x="210" y="365" class="small" text-anchor="middle">下发计划</text>

  <text x="600" y="660" class="small" text-anchor="middle">注：线条为主要数据/策略流，虚线为离线反馈路径</text>
</svg>
