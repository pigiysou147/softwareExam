<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <style>
      .box{fill:#ffffff;stroke:#2c3e50;stroke-width:2}
      .title{font:700 20px Arial;fill:#2c3e50}
      .label{font:14px Arial;fill:#2c3e50}
      .mono{font:12px 'Courier New', monospace;fill:#34495e}
      .line{stroke:#2c3e50;stroke-width:2;fill:none;marker-end:url(#arr)}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
    </marker>
  </defs>
  <text x="600" y="40" text-anchor="middle" class="title">数据结构示意图</text>

  <rect x="60" y="80" width="320" height="160" rx="10" class="box"/>
  <text x="70" y="105" class="label">SessionContext</text>
  <text x="70" y="130" class="mono">sessionId: string</text>
  <text x="70" y="150" class="mono">device: DeviceProfile</text>
  <text x="70" y="170" class="mono">network: NetworkProfile</text>
  <text x="70" y="190" class="mono">currentRoute: string</text>
  <text x="70" y="210" class="mono">candidateRoutes: string[]</text>

  <rect x="440" y="80" width="320" height="120" rx="10" class="box"/>
  <text x="450" y="105" class="label">DeviceProfile</text>
  <text x="450" y="130" class="mono">userAgent: string</text>
  <text x="450" y="150" class="mono">memoryGB: int, cpuCores: int</text>
  <text x="450" y="170" class="mono">lowPowerMode: bool</text>

  <rect x="440" y="220" width="320" height="120" rx="10" class="box"/>
  <text x="450" y="245" class="label">NetworkProfile</text>
  <text x="450" y="270" class="mono">type: string, rttMs: int</text>
  <text x="450" y="290" class="mono">downlinkKbps: int, saveData: bool</text>

  <rect x="60" y="270" width="320" height="160" rx="10" class="box"/>
  <text x="70" y="295" class="label">ResourceNode</text>
  <text x="70" y="320" class="mono">resourceId: string, type: enum</text>
  <text x="70" y="340" class="mono">url: string, sizeKB: float</text>
  <text x="70" y="360" class="mono">deps: string[]</text>
  <text x="70" y="380" class="mono">privacySensitive: bool, crossOrigin: bool</text>

  <rect x="840" y="80" width="320" height="160" rx="10" class="box"/>
  <text x="850" y="105" class="label">PreloadCandidate</text>
  <text x="850" y="130" class="mono">routeId: string, resourceId: string</text>
  <text x="850" y="150" class="mono">probability: float</text>
  <text x="850" y="170" class="mono">utilityScore: float</text>
  <text x="850" y="190" class="mono">explanation: string</text>

  <rect x="840" y="260" width="320" height="160" rx="10" class="box"/>
  <text x="850" y="285" class="label">PreloadPlanItem</text>
  <text x="850" y="310" class="mono">resourceId: string, grade: enum</text>
  <text x="850" y="330" class="mono">startTrigger: string</text>
  <text x="850" y="350" class="mono">ttlMs: int, evictionPriority: int</text>
  <text x="850" y="370" class="mono">concurrencyWeight: int</text>
  <text x="850" y="390" class="mono">retryPolicy: string, cancelOnDegrade: bool</text>

  <rect x="840" y="440" width="320" height="120" rx="10" class="box"/>
  <text x="850" y="465" class="label">PreloadPlan</text>
  <text x="850" y="490" class="mono">items: PreloadPlanItem[]</text>
  <text x="850" y="510" class="mono">version: string, issuer: string, createdAt: string</text>

  <rect x="60" y="470" width="320" height="140" rx="10" class="box"/>
  <text x="70" y="495" class="label">BudgetConstraints</text>
  <text x="70" y="520" class="mono">bandwidthKbps: int, cpuBudget: int</text>
  <text x="70" y="540" class="mono">storageMB: int</text>
  <text x="70" y="560" class="mono">privacyWhitelist/Blacklist: string[]</text>

  <rect x="440" y="470" width="320" height="140" rx="10" class="box"/>
  <text x="450" y="495" class="label">Metrics</text>
  <text x="450" y="520" class="mono">lcpMs, ttiMs, secondHopMs</text>
  <text x="450" y="540" class="mono">hitRate, bandwidthUsedKB, rollbackRate</text>

  <!-- relations -->
  <path class="line" d="M 220 240 L 220 270"/>
  <text x="230" y="260" class="mono">derives graph</text>

  <path class="line" d="M 1000 240 L 1000 260"/>
  <text x="1010" y="250" class="mono">targets</text>

  <path class="line" d="M 1000 420 L 1000 440"/>
  <text x="1010" y="430" class="mono">*--</text>

  <path class="line" d="M 220 540 L 840 500"/>
  <text x="520" y="520" class="mono">constraints</text>

  <path class="line" d="M 600 540 L 1000 500"/>
  <text x="810" y="520" class="mono">logs</text>

  <text x="600" y="860" text-anchor="middle" class="mono">TTL = f(probability, resourceType, networkQuality, cachePressure, retries)</text>
</svg>
