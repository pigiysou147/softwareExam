current_dsl_version: "1.0"
kind: app
app:
  name: DB Classification Assistant
  mode: workflow
  icon: square
  icon_background: "#4CAF50"
  description: Database schema classification to Excel via HTTP tools and LLM.

workflow:
  graph:
    nodes:
      - id: input-1
        type: input
        name: Inputs
        fields:
          - key: database_url
            type: string
            required: true
            default: "postgresql+psycopg://dify:dify@postgres:5432/difydb"
          - key: policy_text
            type: string
            required: false
            default: ""

      - id: http-introspect
        type: http_request
        name: Introspect
        method: POST
        url: "http://schema-service:8000/introspect"
        headers:
          - name: Content-Type
            value: application/json
        body: |
          {"database_url": "{{inputs.database_url}}"}
        result: schemaResp

      - id: llm-classify
        type: llm
        name: Classify
        prompt: |
          You are a data classification expert. Based on the policy and schema, output a JSON array with fields: database, schema, table_name, column_name, level, tags, reason. Only output the JSON array.
          Policy:
          {{inputs.policy_text}}
          Schema:
          {{schemaResp.body.schema}}
        result: llmContent

      - id: http-export
        type: http_request
        name: ExportExcel
        method: POST
        url: "http://schema-service:8000/export-excel"
        headers:
          - name: Content-Type
            value: application/json
        body: |
          {"classification": {{llmContent}}, "output_filename": "db_classification.xlsx"}
        result: exportResp

      - id: output-1
        type: output
        name: Result
        fields:
          - key: file_path
            value: "{{exportResp.body.file_path}}"
          - key: preview
            value: "{{llmContent[0:5]}}"

    edges:
      - from: input-1
        to: http-introspect
      - from: http-introspect
        to: llm-classify
      - from: llm-classify
        to: http-export
      - from: http-export
        to: output-1

